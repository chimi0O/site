  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050508; color: #b0b0b8; font-family: 'Space Mono', monospace;
      line-height: 1.7; padding: 20px; min-height: 100vh;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }
    .container { max-width: 1000px; margin: 0 auto; }

    h1 {
      font-family: 'Syne', sans-serif; text-align: center; color: #fff; font-size: 64px;
      font-weight: 800; letter-spacing: -1px; text-transform: uppercase; margin: 40px 0 30px;
    }

    .menu {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 0;
      margin-bottom: 50px; border-top: 1px solid #222; border-bottom: 1px solid #222;
    }
    .menu a {
      text-decoration: none; color: #666; font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 14px; padding: 15px 25px; transition: 0.3s; text-transform: uppercase;
      letter-spacing: 2px; border-right: 1px solid #222;
    }
    .menu a:last-child { border-right: none; }
    .menu a:hover { color: #fff; background: #111; }
    .menu a.active { color: #000; background: #fff; }

    .content {
      max-width: 800px; margin: 0 auto; background: #0a0a0f; border: 1px solid #1a1a22;
      padding: 40px; font-size: 16px; text-align: justify; position: relative; margin-bottom: 40px;
    }
    .content::before {
      content: ''; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px;
      border-top: 2px solid #fff; border-left: 2px solid #fff;
    }
    .content::after {
      content: ''; position: absolute; bottom: -1px; right: -1px; width: 20px; height: 20px;
      border-bottom: 2px solid #fff; border-right: 2px solid #fff;
    }

    .source-list { list-style: none; }
    .source-list li {
      padding: 20px 0; border-bottom: 1px solid #1a1a22;
    }
    .source-list li:last-child { border-bottom: none; }
    .source-list a {
      color: #fff; text-decoration: none; font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 18px; transition: 0.3s; display: inline-block;
    }
    .source-list a:hover { color: #888; transform: translateX(5px); }
    .source-list .desc {
      display: block; color: #555; font-size: 13px; margin-top: 5px;
    }

    .img-center { text-align: center; margin: 40px 0; }
    .img-center img {
      width: 40%; min-width: 200px; filter: grayscale(100%) contrast(1.2);
      transition: 0.5s; border: 1px solid #222;
    }
    .img-center img:hover { filter: grayscale(0%) contrast(1); }

    hr { border: 0; height: 1px; background: #222; width: 50%; margin: 50px auto; }
    footer { text-align: center; font-size: 12px; color: #444; padding-bottom: 30px; letter-spacing: 1px; }

    @media (max-width: 700px) {
      h1 { font-size: 40px; }
      .menu a { padding: 10px 15px; font-size: 12px; border-right: none; border-bottom: 1px solid #222; width: 50%; text-align: center; }
      .content { padding: 25px; }
    }
  </style>
</head>
